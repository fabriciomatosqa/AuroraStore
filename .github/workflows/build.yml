name: Build Aurora Store PS4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate package icon
        run: |
          mkdir -p sce_sys/about
          python3 tools/generate_icon.py

      - name: Build PKG with the official OpenOrbis container
        run: |
          docker run --rm --user 0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc '
              set -eux
              echo "Toolchain: $OO_PS4_TOOLCHAIN"
              RIGHT_SPRX="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -print -quit)"
              test -n "$RIGHT_SPRX"
              cp "$RIGHT_SPRX" sce_sys/about/right.sprx
              make
            '

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStore-PS4
          path: "*.pkg"
          if-no-files-found: error
          retention-days: 30
